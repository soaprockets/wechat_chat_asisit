[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wechat-agent"
version = "0.1.0"
description = "A WeChat AI chatbot built with LangGraph"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "WeChat Agent Team" },
]
keywords = ["wechat", "agent", "langgraph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "redis>=5.0",
    "chromadb>=0.5.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0",
    "structlog>=24.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0",
    "fakeredis>=2.25",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]
ingestion = [
    "pymupdf>=1.24.0",
]
vision = [
    "Pillow>=10.0.0",
    "pyobjc-framework-Quartz>=10.0.0",
]

[project.scripts]
wechat-agent = "wechat_agent.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wechat_agent"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "wechat_agent.memory.session_store"
disable_error_code = ["no-untyped-call"]

[[tool.mypy.overrides]]
module = "wechat_agent.memory.profile_store"
disable_error_code = ["no-untyped-call", "attr-defined", "assignment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=wechat_agent --cov-report=term-missing"
